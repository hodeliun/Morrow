name: Pilot Windows JSONL transport
on:
  push:
    branches:
      - codex/e003-g07-windows-runtime
    paths:
      - .github/workflows/pilot-windows-jsonl.yml
      - scripts/pilot/windows-native-process.ps1
      - scripts/pilot/windows-native-process.own.test.ps1
      - scripts/pilot/windows-native-process.independent.test.ps1
      - scripts/pilot/windows-native-process.controller*.ps1

permissions:
  contents: read

jobs:
  transport:
    name: JSONL ${{ matrix.leaf }} ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leaf:
          - '246'
          - '247'
        suite:
          - own
          - independent
    env:
      POLARIS_SUITE: ${{ matrix.suite }}
      POLARIS_JSONL_LEAF: ${{ matrix.leaf }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify JSONL transport with synthetic fixtures
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $suite = $env:POLARIS_SUITE
          $leaf = $env:POLARIS_JSONL_LEAF
          if ($leaf -cnotin @('246', '247') -or $suite -cnotin @('own', 'independent')) {
            throw 'Unexpected JSONL suite.'
          }
          $name = 'morrow-jsonl-{0}-{1}-{2}-{3}-{4}' -f $leaf, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_SHA, $suite
          $root = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path -LiteralPath $root) { throw 'JSONL evidence root already exists.' }
          $null = New-Item -ItemType Directory -Path $root
          $receiptPath = Join-Path $root 'workflow-receipt.json'
          $utf8 = [Text.UTF8Encoding]::new($false)
          $receipt = [ordered]@{
            schemaVersion = 1
            issue = [int]$leaf
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            suite = $suite
            status = 'initializing'
            testExitCode = $null
            exitCode = 1
            powershell = $PSVersionTable.PSVersion.ToString()
            os = [Environment]::OSVersion.VersionString
            appLaunched = $false
            driverStarted = $false
            guiTested = $false
            sources = @()
            regressions = @()
            failure = $null
          }
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 6), $utf8)
          try {
            $paths = @(
              '.github/workflows/pilot-windows-jsonl.yml',
              'scripts/pilot/windows-native-process.ps1',
              'scripts/pilot/windows-native-process.own.test.ps1',
              'scripts/pilot/windows-native-process.independent.test.ps1',
              'scripts/pilot/windows-native-process-policy.ps1'
            )
            if ($leaf -ceq '247') {
              $paths += @(
                'scripts/pilot/windows-native-process.controller.ps1',
                'scripts/pilot/windows-native-process.controller.own.test.ps1',
                'scripts/pilot/windows-native-process.controller.independent.test.ps1',
                'scripts/pilot/windows-process.ps1',
                'scripts/pilot/windows-native-job.ps1',
                'scripts/pilot/windows-native-job.own.test.ps1',
                'scripts/pilot/windows-native-job.independent.test.ps1',
                'scripts/pilot/windows-native-process-policy.own.test.ps1',
                'scripts/pilot/windows-native-process-policy.independent.test.ps1'
              )
            }
            $receipt.sources = @(
              foreach ($relative in $paths) {
                $source = Join-Path $env:GITHUB_WORKSPACE $relative
                $file = Get-Item -LiteralPath $source
                [ordered]@{
                  path = $relative
                  bytes = $file.Length
                  sha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
            )
            $engine = (Get-Command pwsh -CommandType Application | Select-Object -First 1).Source
            $stem = if ($leaf -ceq '247') { 'windows-native-process.controller' } else { 'windows-native-process' }
            $test = Join-Path $env:GITHUB_WORKSPACE ("scripts/pilot/{0}.{1}.test.ps1" -f $stem, $suite)
            $log = Join-Path $root 'suite.log'
            $evidence = Join-Path $root 'suite-evidence'
            & $engine -NoProfile -NonInteractive -File $test -EvidenceRoot $evidence *> $log
            $receipt.testExitCode = $LASTEXITCODE
            if ($leaf -ceq '247' -and $receipt.testExitCode -eq 0) {
              foreach ($regression in @(
                @{ issue = 188; stem = 'windows-native-job' },
                @{ issue = 189; stem = 'windows-native-process-policy' }
              )) {
                $name = 'regression-{0}-{1}' -f $regression.issue, $suite
                $regressionTest = Join-Path $env:GITHUB_WORKSPACE ("scripts/pilot/{0}.{1}.test.ps1" -f $regression.stem, $suite)
                $regressionLog = Join-Path $root "$name.log"
                $arguments = @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', $regressionTest, '-EvidenceRoot', (Join-Path $root $name))
                if ($regression.issue -eq 189 -and $suite -ceq 'independent') {
                  $arguments += @('-PolicyPath', (Join-Path $env:GITHUB_WORKSPACE 'scripts/pilot/windows-native-process-policy.ps1'))
                }
                & $engine @arguments *> $regressionLog
                $receipt.regressions += [ordered]@{
                  issue = $regression.issue
                  suite = $suite
                  exitCode = $LASTEXITCODE
                  logSha256 = (Get-FileHash -LiteralPath $regressionLog -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
            }
            $regressionFailures = @($receipt.regressions | Where-Object { $_.exitCode -ne 0 })
            if ($receipt.testExitCode -eq 0 -and $regressionFailures.Count -eq 0) {
              $receipt.status = if ($leaf -ceq '246') { 'framing-tests-passed' } else { 'controller-tests-passed' }
              $receipt.exitCode = 0
            } else {
              $receipt.status = if ($leaf -ceq '246') { 'framing-tests-failed' } else { 'controller-or-regression-tests-failed' }
            }
          } catch {
            $receipt.status = 'workflow-failed'
            $receipt.failure = [ordered]@{ type = $_.Exception.GetType().FullName }
          } finally {
            [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 6), $utf8)
          }
          exit $receipt.exitCode

      - name: Upload JSONL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrow-jsonl-${{ matrix.leaf }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/morrow-jsonl-${{ matrix.leaf }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 30
